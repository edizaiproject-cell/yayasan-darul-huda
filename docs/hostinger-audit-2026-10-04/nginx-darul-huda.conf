# Include within Nginx http context (sites-enabled on Ubuntu).
# Replace every example.org. Obtain certificates BEFORE enabling TLS blocks.
limit_req_zone $binary_remote_addr zone=dh_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dh_donation:10m rate=10r/m;
server {
    listen 80;
    server_name example.org www.example.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://example.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    client_body_timeout 20s;
    limit_req_status 429;
    # Enable after HTTPS/renewal verification:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\. { deny all; }
    location ~* ^/(data|source-reference|node_modules)(/|$) { return 404; }
    location = /api/login {
        limit_req zone=dh_login burst=5 nodelay;
        include /etc/nginx/snippets/darul-huda-proxy.conf;
    }
    location = /api/donation-submit {
        client_max_body_size 6m;
        limit_req zone=dh_donation burst=5 nodelay;
        include /etc/nginx/snippets/darul-huda-proxy.conf;
    }
    location / { include /etc/nginx/snippets/darul-huda-proxy.conf; }
}
